name: 🐛 Bug Report
description: Report an issue or unexpected behavior in agent-brain CLI, doctor, or schemas.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please ensure you are not posting any credentials, API keys, or private conversation logs.
  - type: input
    id: version
    attributes:
      label: agent-brain version
      description: Run `agent-brain --version` or check Python package version.
      placeholder: "e.g. 0.9.0"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version and OS
      placeholder: "e.g. Python 3.11 on macOS Sonoma / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug and what command you ran.
      placeholder: "When running `agent-brain doctor ...`, received error..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Safety & pre-check
      options:
        - label: I confirmed this report contains NO passwords, tokens, API keys, or private customer data.
          required: true
        - label: I checked existing issues to confirm this is not a duplicate.
          required: true
