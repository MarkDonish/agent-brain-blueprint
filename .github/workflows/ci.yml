name: verify-template

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The Makefile is the single source of truth for verification steps;
      # CI must not re-implement them (that is how drift happens).
      - name: Full verification
        run: make verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff (dev-only; runtime stays stdlib-zero)
        run: python -m pip install ruff

      - name: Lint
        run: ruff check .
