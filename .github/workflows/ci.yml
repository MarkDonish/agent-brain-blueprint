name: verify-template

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Template vault checks
        run: |
          python scripts/check_vault_structure.py templates/vault
          python scripts/check_memory_governance.py templates/vault
          python scripts/check_session_claims.py templates/vault
          python scripts/doctor.py templates/vault

      - name: Privacy scan (public checkout)
        run: python scripts/check_privacy_scan.py .

      - name: Bootstrap smoke test
        run: |
          python scripts/bootstrap.py --destination "$RUNNER_TEMP/demo-vault" --project example-app
          python scripts/doctor.py "$RUNNER_TEMP/demo-vault"
          python scripts/check_claim_gate.py "$RUNNER_TEMP/demo-vault" --path 10_projects/example-app/10_current_work/INDEX.md
          python scripts/check_privacy_scan.py "$RUNNER_TEMP/demo-vault"
