name: verify-template

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_memory_governance.py templates/vault
      - run: python scripts/check_session_claims.py templates/vault
      - run: python scripts/doctor.py templates/vault
