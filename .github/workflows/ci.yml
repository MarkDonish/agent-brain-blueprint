name: verify-template

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        env:
          PYTHONPATH: src:scripts
        run: python -m unittest discover -s tests -v

      - name: CLI smoke
        env:
          PYTHONPATH: src:scripts
        run: |
          python -m agent_brain --version
          python -m agent_brain init --destination "$RUNNER_TEMP/cli-vault" --project cli-app
          python -m agent_brain doctor "$RUNNER_TEMP/cli-vault"
          python -m agent_brain claim acquire "$RUNNER_TEMP/cli-vault" --session-id ci --task "ci" --path 10_projects/cli-app/10_current_work/INDEX.md --filename ci-claim.md
          python -m agent_brain claim gate "$RUNNER_TEMP/cli-vault" --claim 40_handoffs/session_claims/ci-claim.md

      - name: Template vault checks
        run: |
          python scripts/check_vault_format.py templates/vault --require-manifest
          python scripts/check_vault_structure.py templates/vault
          python scripts/check_memory_governance.py templates/vault
          python scripts/check_session_claims.py templates/vault
          python scripts/doctor.py templates/vault

      - name: Demo vault checks
        run: |
          python scripts/doctor.py examples/demo-vault
          python scripts/check_session_claims.py examples/demo-vault
          python scripts/check_claim_gate.py examples/demo-vault --path 10_projects/demo-notes-app/60_summaries/INDEX.md
          python -c 'import json,subprocess,sys; p=subprocess.run([sys.executable,"scripts/check_claim_gate.py","examples/demo-vault","--path","10_projects/demo-notes-app/10_current_work/INDEX.md"],capture_output=True,text=True); r=json.loads(p.stdout); assert r.get("allowed") is False and r.get("conflict_count",0)>=1, r; print("demo foreign conflict ok")'
          python scripts/check_claim_gate.py examples/demo-vault --session-id 20260801-0900-codex-auth --path 10_projects/demo-notes-app/10_current_work/INDEX.md
          python scripts/check_claim_gate.py examples/demo-vault --claim 40_handoffs/session_claims/2026-08-01_codex-auth-claim.md

      - name: Privacy scan (public checkout)
        run: python scripts/check_privacy_scan.py .

      - name: Bootstrap smoke test
        run: |
          python scripts/bootstrap.py --destination "$RUNNER_TEMP/demo-vault" --project example-app
          python scripts/doctor.py "$RUNNER_TEMP/demo-vault"
          python scripts/check_claim_gate.py "$RUNNER_TEMP/demo-vault" --path 10_projects/example-app/10_current_work/INDEX.md
          python scripts/check_privacy_scan.py "$RUNNER_TEMP/demo-vault"
