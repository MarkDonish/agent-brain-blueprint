[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-brain-blueprint"
version = "0.9.1"
description = "Local-first Markdown vault blueprint and CLI for multi-agent shared memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MarkDonish" }]
keywords = ["multi-agent", "markdown", "memory", "codex", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Topic :: Software Development :: Libraries",
]
# Zero runtime third-party dependencies.
dependencies = []

[project.scripts]
agent-brain = "agent_brain.cli.main:main"

[project.urls]
Homepage = "https://github.com/MarkDonish/agent-brain-blueprint"
Repository = "https://github.com/MarkDonish/agent-brain-blueprint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_brain = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
# Pyflakes + pycodestyle errors. Style-only rules are intentionally excluded
# to keep diffs small; runtime code must stay stdlib-zero regardless.
# E402 is expected: scripts and tests bootstrap sys.path before lib imports.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
